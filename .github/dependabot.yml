# Dependabot opens pull requests when dependencies have updates or security fixes.
# Updates are grouped weekly so they arrive as a few PRs, each checked by CI before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
